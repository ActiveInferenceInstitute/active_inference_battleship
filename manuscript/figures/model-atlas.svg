   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="8.64" y="19.277812" transform="rotate(-0 8.64 19.277812)">The model, the environment, and the decision</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #176d59" x="8.64" y="47.578359" transform="rotate(-0 8.64 47.578359)">A checked notation contract and a strict public-information boundary</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="86.838281" transform="rotate(-0 18.72 86.838281)">Specify and compile</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 111.998437)">GNN declares fleet labels, observations, priors, preferences, and time.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 124.715937)">The upstream parser and strict adapter bind the supported backend.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="194.118281" transform="rotate(-0 18.72 194.118281)">ENVIRONMENT</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="252" y="194.118281" transform="rotate(-0 252 194.118281)">ASSISTANT</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="233.718281" transform="rotate(-0 18.72 233.718281)">Hidden selected fleet</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 258.878437)">Generates deterministic</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 271.595937)">hit or miss at the chosen cell.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 284.313437)">Its layout stays private.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="260.64" y="233.718281" transform="rotate(-0 260.64 233.718281)">Joint posterior</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 258.878437)">Given public cell and hit/miss,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 271.595937)">update joint fleet log weights.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 284.313437)">Cells remain correlated.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="260.64" y="375.558281" transform="rotate(-0 260.64 375.558281)">Compare legal actions</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 400.780938)">Preference cost − β × information</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 413.498438)">Softmax with precision and habits</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="375.558281" transform="rotate(-0 18.72 375.558281)">Execute one shot</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 400.718438)">An unvisited coordinate is chosen.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 413.435938)">The next observation starts</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 426.153438)">another update.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="492.198281" transform="rotate(-0 18.72 492.198281)">Scope of this implementation</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 517.358437)">Exact Bayesian updates within a sampled, biased catalog; one-step action scoring.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 530.075938)">Assumed sensor noise changes beliefs, not the truthful game environment.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 542.793437)">No arbitrary GNN execution, unrestricted fleet-space inference, or learning.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #425c68" x="8.64" y="581.930484" transform="rotate(-0 8.64 581.930484)">Generalized Notation Notation is a model specification, not a graph neural network.</text>
   </g>
  </g>
 </g>
