   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="8.64" y="22.764688" transform="rotate(-0 8.64 22.764688)">The model, the environment, and the decision</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #176d59" x="8.64" y="49.847344" transform="rotate(-0 8.64 49.847344)">A checked notation contract and a strict public-information boundary</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="89.172344" transform="rotate(-0 18.72 89.172344)">Specify and compile</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 114.159375)">GNN declares fleet labels, observations, priors, preferences, and time.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 128.159375)">The upstream parser and strict adapter bind the supported backend.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="197.463828" transform="rotate(-0 18.72 197.463828)">ENVIRONMENT</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="252" y="197.463828" transform="rotate(-0 252 197.463828)">ASSISTANT</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="237.160937" transform="rotate(-0 18.72 237.160937)">Hidden selected fleet</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 262.008125)">Generates deterministic</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 276.008125)">hit or miss at the chosen cell.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 289.039375)">Its layout stays private.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="260.64" y="236.095312" transform="rotate(-0 260.64 236.095312)">Joint posterior</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 261.039375)">Given public cell and hit/miss,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 275.039375)">update joint fleet log weights.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 290.008125)">Cells remain correlated.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="260.64" y="377.892344" transform="rotate(-0 260.64 377.892344)">Compare legal actions</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 402.910625)">Preference cost − β × information</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(260.64 416.879375)">Softmax with precision and habits</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="379.000937" transform="rotate(-0 18.72 379.000937)">Execute one shot</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 403.848125)">An unvisited coordinate is chosen.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 417.848125)">The next observation starts</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 430.879375)">another update.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182f3b" x="18.72" y="494.575312" transform="rotate(-0 18.72 494.575312)">Scope of this implementation</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 519.519375)">Exact Bayesian updates within a sampled, biased catalog; one-step action scoring.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 533.519375)">Assumed sensor noise changes beliefs, not the truthful game environment.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425c68" transform="translate(18.72 547.519375)">No arbitrary GNN execution, unrestricted fleet-space inference, or learning.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #425c68" x="8.64" y="584.026594" transform="rotate(-0 8.64 584.026594)">Generalized Notation Notation is a model specification, not a graph neural network.</text>
   </g>
  </g>
 </g>
